# Labels for the known sample (phase 4).
#
# !!! NEEDS MANUAL VERIFICATION !!!
# These labels were written by the assistant, not by the project owner. They were produced by reading each
# advisory's affected range in tests/sample/snapshot/osv/PyPI.index.json against the pinned version. Treat them
# as a draft, not as ground truth, until the owner has checked them and set `verified_by_owner: true`.
#
# What the labels mean:
#   affected        the published advisory range includes this exact version. It says nothing about whether
#                   the vulnerable code path is reachable in an application.
#   retracted       the only advisory was withdrawn by its publisher; whether it ever applied is unknown.
#   false_positive  a scan report claims it, but the advisory range does NOT include this version.
#   unconfirmed     a scan report claims it and no advisory in the snapshot mentions it.
#   clean           no advisory in the snapshot affects this package at this version.
verified_by_owner: false

