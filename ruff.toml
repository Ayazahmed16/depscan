# Lint settings for depscan. Kept in the repo so results do not depend on anyone's global ruff config.
line-length = 140
target-version = "py311"

[lint]
# E/F: pycodestyle errors and pyflakes (real bugs). I: import order. UP: modern syntax. B: likely bugs.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
